<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatGuard · 校园端</title>
<style>
  :root{
    --bg:#F4F5F7; --card:#fff; --ink:#1A1D24; --ink2:#5C6273; --ink3:#8A90A0;
    --line:#E6E8EE; --brand:#2F6FED; --brand-bg:#EDF2FE;
    --crit:#D93025; --high:#E8710A; --med:#B8860B; --low:#1E8E3E; --none:#5F6368;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:64px 16px 50px}

  header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--brand)}
  .school{font-size:12.5px;color:var(--ink3);margin-top:3px;font-weight:400}
  .badge{font-size:11.5px;color:#8A6D00;background:#FFF6DB;border:1px solid #F2E2AE;
         padding:4px 9px;border-radius:999px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  .stat{background:var(--card);border-radius:12px;padding:13px 14px;
        box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .stat .k{font-size:12px;color:var(--ink3)}
  .stat .v{font-size:22px;font-weight:700;margin-top:2px}
  .stat .d{font-size:11.5px;color:var(--ink3)}

  .cols{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;align-items:start}
  .card{background:var(--card);border-radius:12px;padding:15px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .card h2{margin:0 0 12px;font-size:13px;color:var(--ink2);font-weight:600}

  .ev{display:flex;gap:11px;padding:11px 10px;border-radius:10px;cursor:pointer;
      border:1px solid transparent;transition:.15s}
  .ev:hover{background:#F7F8FA}
  .ev.on{background:var(--brand-bg);border-color:#CFDDFB}
  .ev .bar{width:3px;border-radius:2px;flex:none}
  .ev .body{flex:1;min-width:0}
  .ev .l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .ev .tp{font-weight:600;font-size:13.5px}
  .ev .an{font-size:11.5px;color:var(--ink3);font-family:ui-monospace,monospace}
  .ev .l2{font-size:12px;color:var(--ink2);margin-top:3px;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .tm{font-size:11.5px;color:var(--ink3);margin-top:3px}

  .pill{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink2)}
  .pill.pending{background:#FFF6DB;border-color:#F2E2AE;color:#8A6D00}
  .pill.contacted{background:#EAF3FF;border-color:#CFE0FB;color:#26517F}
  .pill.closed{background:#F2F3F6;color:var(--ink3)}

  .detail .lv{display:inline-block;color:#fff;font-size:11.5px;padding:2px 8px;border-radius:6px}
  .detail .h{font-size:15px;font-weight:700;margin:8px 0 2px}
  .detail .sub{font-size:12px;color:var(--ink3)}
  .tl{margin:14px 0 0;padding-left:0;list-style:none}
  .tl li{position:relative;padding:0 0 12px 18px;font-size:13px;color:var(--ink)}
  .tl li::before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;
                 border-radius:50%;background:#C9CFDA}
  .tl li:not(:last-child)::after{content:"";position:absolute;left:4.5px;top:15px;bottom:0;
                 width:1px;background:#E6E8EE}
  .tl .t{font-size:11.5px;color:var(--ink3);display:block}
  .action{background:var(--brand-bg);border-radius:9px;padding:10px 12px;font-size:13px;
          color:#22406F;margin-top:12px;line-height:1.6}
  .actions{display:flex;gap:8px;margin-top:12px}
  .actions button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--line);
                  background:#fff;font:13px inherit;color:var(--ink2);cursor:pointer}
  .actions button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

  .bars{display:flex;flex-direction:column;gap:9px}
  .barrow{display:grid;grid-template-columns:96px 1fr 34px;gap:9px;align-items:center;font-size:12.5px}
  .track{height:8px;border-radius:4px;background:#EFF1F5;overflow:hidden}
  .track i{display:block;height:100%;background:var(--brand);border-radius:4px}
  .num{text-align:right;color:var(--ink3)}

  .scripts{list-style:none;margin:0;padding:0}
  .scripts li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
              border-bottom:1px dashed #EEF0F4;font-size:13px}
  .scripts li:last-child{border-bottom:0}
  .scripts .c{color:var(--ink3);font-size:12px;flex:none}


  /* 数据源切换条 */
  .srcbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .srcbtn{border:0;cursor:pointer;border-radius:14px;padding:14px 26px;
          font:600 15px/1 inherit;color:#fff;letter-spacing:.5px;
          background:linear-gradient(110deg,#5B8DEF,#8B5CF6,#EC4899,#F59E0B,#5B8DEF);
          background-size:300% 100%;animation:flow 7s linear infinite;
          box-shadow:0 6px 18px rgba(91,141,239,.35);transition:.18s}
  .srcbtn:hover{transform:translateY(-1px)}
  .srcbtn.off{background:#E9ECF2;color:#5C6273;animation:none;box-shadow:none}
  @keyframes flow{0%{background-position:0% 0}100%{background-position:300% 0}}
  .srcbtn .sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;
                margin-right:9px;vertical-align:middle}
  .srcbtn.off .sdot{background:#9AA1AE}
  .refbtn{border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;
          border-radius:12px;padding:13px 20px;font:600 14px/1 inherit}
  .refbtn:hover{background:#F7F8FA}
  .refbtn.danger{color:#C0392B;border-color:#F0C9C4}
  .refbtn.danger:hover{background:#FDF2F0}
  .srchint{font-size:12px;color:var(--ink3)}
  .privacy{margin-top:16px;background:#FBFCFE;border:1px solid var(--line);border-radius:12px;
           padding:13px 15px;font-size:12.5px;color:var(--ink2);line-height:1.7}
  .privacy h3{margin:0 0 6px;font-size:12.5px;color:var(--ink2);font-weight:600}
  .privacy b{color:var(--ink)}
  .foot{text-align:center;color:var(--ink3);font-size:11.5px;margin-top:18px}
  .hidden{display:none}
  @media (max-width:820px){
    .cols{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand"><span class="dot"></span>ChatGuard · 校园端</div>
      <div class="school" id="school">加载中…</div>
    </div>
    <div class="badge" id="badge">演示数据</div>
  </header>


  <div class="srcbar">
    <button id="btnSample" class="srcbtn"><span class="sdot"></span>演示数据</button>
    <button id="btnRefresh" class="refbtn">刷新</button>
    <button id="btnClear" class="refbtn danger" style="display:none">清空真实数据</button>
    <span class="srchint" id="srcHint">当前使用演示数据；关闭开关后从后端拉取真实记录</span>
  </div>
  <section class="stats" id="stats"></section>

  <div class="cols">
    <section class="card">
      <h2>待处理告警</h2>
      <div id="list"></div>
    </section>

    <section class="card detail" id="detail">
      <h2>告警详情</h2>
      <div style="color:var(--ink3);font-size:13px">点左侧任意一条查看</div>
    </section>
  </div>

  <div class="cols" style="margin-top:14px">
    <section class="card">
      <h2>本周高频话术 Top 5</h2>
      <ul class="scripts" id="scripts"></ul>
    </section>
    <section class="card">
      <h2>本周类型分布</h2>
      <div class="bars" id="byType"></div>
    </section>
  </div>

  <div class="privacy">
    <h3>隐私说明</h3>
    这里看不到聊天内容，这是设计如此。
    校园端只接收<b>结构化事件</b>：谁（匿名 ID）、什么类型、什么级别、发生在什么时候、建议怎么处理。
    聊天原文始终留在学生自己的手机上；若确需查看，必须由<b>学生本人在应用内单独授权</b>，并且只开放单次、限时、留痕的访问。
    学生未绑定学校时，系统不会向任何学校推送。
  </div>

  <div class="foot">ChatGuard 校园端 · 演示数据 · AI 判断仅供参考</div>
</div>
<script src="admin.js"></script>
</body>
</html>
